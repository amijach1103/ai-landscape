<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>AI Newsletter Collector</h2>

        <div class="current-page">
            <h3>Current Article:</h3>
            <div id="currentTitle" class="title-display">Loading...</div>
            <div id="currentUrl" class="url-display">Loading...</div>
        </div>

        <div class="actions">
            <button id="saveBtn" class="btn btn-primary">
                ✓ Save Article
            </button>
            <button id="saveWithNoteBtn" class="btn btn-secondary">
                📝 Save with Note
            </button>
        </div>

        <div id="noteSection" class="note-section hidden">
            <textarea id="noteInput" placeholder="Why is this article interesting? (optional)"></textarea>
            <button id="confirmNoteBtn" class="btn btn-primary">Save with Note</button>
            <button id="cancelNoteBtn" class="btn btn-cancel">Cancel</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="weekCount">0</span>
                <span class="stat-label">this week</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="articleCount">0</span>
                <span class="stat-label">total</span>
            </div>
        </div>

        <div class="actions">
            <button id="viewBtn" class="btn btn-outline">
                📋 View Saved Articles
            </button>
            <button id="exportBtn" class="btn btn-accent">
                📤 Export for Tracker
            </button>
        </div>

        <div id="savedList" class="saved-list hidden"></div>

        <div id="exportOutput" class="export-output hidden">
            <h3>Copy this to your tracker:</h3>
            <textarea id="exportText" readonly></textarea>
            <div class="export-actions">
                <button id="copyBtn" class="btn btn-primary">📋 Copy to Clipboard</button>
                <button id="copyAndClearBtn" class="btn btn-accent">📋 Copy & Clear All</button>
            </div>
            <button id="closeExportBtn" class="btn btn-cancel">Close</button>
        </div>

        <div id="feedback" class="feedback hidden"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
